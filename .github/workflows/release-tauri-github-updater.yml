name: Release Tauri GitHub Updater

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Verify updater endpoint points to GitHub Releases
        shell: pwsh
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw
          if ($config -notmatch 'https://github.com/itmoenyu/DevTools-Launcher/releases/latest/download/latest.json') {
            throw 'tauri.conf.json 中的 updater endpoint 不是预期的 GitHub Releases 地址，请先检查配置。'
          }

      - name: Verify updater pubkey is configured
        shell: pwsh
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw
          if ($config -match 'PLEASE_REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY') {
            throw '检测到 updater 公钥仍是占位值，请先替换成真实公钥后再发版。'
          }

      - name: Verify signing secrets are configured
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'GitHub Actions Secret TAURI_SIGNING_PRIVATE_KEY 未配置，Tauri updater 无法生成签名产物。'
          }

          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'GitHub Actions Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD 未配置，Tauri updater 无法解锁私钥。'
          }

      - name: Verify signing private key format
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY -match '^\s*[A-Za-z]:\\') {
            throw 'TAURI_SIGNING_PRIVATE_KEY 不能填写本机文件路径。GitHub Actions 需要的是 minisign 私钥文件的完整文本内容。'
          }

          if ($env:TAURI_SIGNING_PRIVATE_KEY -match 'minisign public key' -or $env:TAURI_SIGNING_PRIVATE_KEY -match 'PLEASE_REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY') {
            throw 'TAURI_SIGNING_PRIVATE_KEY 看起来像公钥内容。这里必须填写 minisign 私钥文件内容，不能填写 tauri.conf.json 里的 pubkey。'
          }

          if (
            $env:TAURI_SIGNING_PRIVATE_KEY -notmatch 'minisign encrypted secret key' -and
            $env:TAURI_SIGNING_PRIVATE_KEY -notmatch 'rsign encrypted secret key' -and
            $env:TAURI_SIGNING_PRIVATE_KEY -notmatch 'RWRTY0Iy' -and
            $env:TAURI_SIGNING_PRIVATE_KEY -notmatch 'dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWduIGVuY3J5cHRlZCBzZWNyZXQga2V5'
          ) {
            throw 'TAURI_SIGNING_PRIVATE_KEY 格式看起来不对。请重新打开本地的 minisign 私钥文件，把完整内容原样复制到 GitHub Secret。'
          }

      - name: Collect release notes from commits
        id: collect_release_notes
        shell: pwsh
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          $currentTag = $env:CURRENT_TAG
          $previousTag = git tag --sort=-version:refname | Where-Object { $_ -ne $currentTag } | Select-Object -First 1

          if ($previousTag) {
            $commitLines = git log "$previousTag..HEAD" --pretty=format:'%s|%h'
          } else {
            $commitLines = git log -10 --pretty=format:'%s|%h'
          }

          $releaseNoteLines = @()
          foreach ($line in $commitLines) {
            if ([string]::IsNullOrWhiteSpace($line)) {
              continue
            }

            $parts = $line -split '\|', 2
            $subject = $parts[0].Trim()
            $shortSha = if ($parts.Length -gt 1) { $parts[1].Trim() } else { '' }

            if ([string]::IsNullOrWhiteSpace($subject) -or $subject -match '^release:\s*v') {
              continue
            }

            if ([string]::IsNullOrWhiteSpace($shortSha)) {
              $releaseNoteLines += "- $subject"
            } else {
              $releaseNoteLines += "- $subject ($shortSha)"
            }
          }

          if ($releaseNoteLines.Count -eq 0) {
            $releaseNoteLines = @('- 本次版本主要包含稳定性优化与问题修复。')
          }

          $bodyLines = @(
            "## 更新说明"
            ""
          )

          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            $bodyLines += "变更范围：$previousTag -> $currentTag"
            $bodyLines += ""
          }

          $bodyLines += $releaseNoteLines
          $releaseBody = ($bodyLines -join "`n").Trim()

          "body<<EOF" >> $env:GITHUB_OUTPUT
          $releaseBody >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DevTools Launcher ${{ github.ref_name }}
          releaseBody: ${{ steps.collect_release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ''
